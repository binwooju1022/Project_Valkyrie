<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="37" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2" intercept="-0.65"/>
      <feFuncG type="linear" slope="2" intercept="-0.65"/>
      <feFuncB type="linear" slope="2" intercept="-0.65"/>
      <feFuncA type="discrete" tableValues="1 1"/>
    </feComponentTransfer>
  </filter>
  <rect width="192" height="192" filter="url(#grain)"/>
</svg>

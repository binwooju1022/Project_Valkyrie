name: Browser regression
on:
  push:
    branches: ['fix/mobile-staged-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: playback
            modules: replay-entry release-content scene-stability usability-layout playback-smoke report-lifecycle narration-merges music-ending progress-import
          - suite: reports
            modules: report-navigation
          - suite: navigation
            modules: immersion-guidance viewport-compatibility compact-menu landscape archive-navigation archive-interruptions usability-controls
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Unit regression
        run: node --test tests/bookmarks.test.mjs tests/progress-store.test.mjs tests/reading-speed.test.mjs
      - name: Browser regression
        run: node tests/browser/run.mjs ${{ matrix.modules }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-${{ matrix.suite }}
          path: test-results/
